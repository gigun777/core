<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDO Core Demo</title>
    <link rel="stylesheet" href="./dist/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { createSEDO, createMemoryStorage } from './dist/index.js';
      import { createModuleManagerUI } from './dist/ui/ui_core.js';

      const exampleModule = {
        id: 'module-example-inline',
        version: '1.0.0',
        init(ctx) {
          ctx.ui.registerButton({
            id: 'example:hello',
            label: 'Hello module',
            location: 'toolbar',
            order: 50,
            onClick() { alert('Hello from module button'); }
          });

          ctx.ui.registerPanel({
            id: 'example:settings',
            title: 'Example settings panel',
            location: 'settings',
            order: 10,
            render(mountEl) {
              const p = document.createElement('p');
              p.textContent = 'Panel from module via ctx.ui.registerPanel()';
              mountEl.append(p);
              return () => p.remove();
            }
          });
        }
      };

      const sdo = createSEDO({
        storage: createMemoryStorage(),
        mount: document.getElementById('app'),
        createUI: createModuleManagerUI,
        modules: [exampleModule]
      });

      await sdo.start();
      window.sdo = sdo;
    </script>
  </body>
</html>
